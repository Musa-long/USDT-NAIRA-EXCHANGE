<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin — USDT Naira Exchange</title><link rel="stylesheet" href="/admin.css"></head>
<body>
<div class="wrap">
  <header><a href="/">← Public site</a><h1>USDT Exchange Admin</h1></header>
  <section id="login" class="panel">
    <h2>Admin Login</h2><p>Enter your server admin password.</p>
    <input id="password" type="password" placeholder="Admin password"><button onclick="login()">LOGIN</button><div id="loginError"></div>
  </section>

  <div id="dashboard" class="hidden">
    <section class="panel">
      <h2>Exchange settings</h2>
      <div class="grid">
        <label>USDT rate (₦ per 1 USDT)<input id="rate" type="number" step="0.01"></label>
        <label>Bank name<input id="bankName"></label>
        <label>Account name<input id="accountName"></label>
        <label>Account number<input id="accountNumber"></label>
        <label>USDT network<input id="network" value="TRC20"></label>
      </div>
      <button onclick="saveSettings()">SAVE SETTINGS</button><span id="saveMsg"></span>
    </section>
    <section class="panel">
      <div class="row"><h2>Orders</h2><button onclick="loadOrders()">REFRESH</button></div>
      <div class="table-wrap"><table><thead><tr><th>Ref</th><th>Naira</th><th>USDT</th><th>Wallet</th><th>Status</th><th>Date</th></tr></thead><tbody id="orders"></tbody></table></div>
    </section>
  </div>
</div>
<script src="/admin.js"></script>
</body>
</html>
