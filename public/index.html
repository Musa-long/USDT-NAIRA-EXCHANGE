<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NairaFlow - Buy USDT</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #0a0f0d; color: #fff; min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
    .container { width: 100%; max-width: 450px; }
    .logo-box { width: 48px; height: 48px; background: #00ff88; border-radius: 14px; margin-bottom: 8px; }
    .brand-sub { font-size: 13px; color: #888; letter-spacing: 1px; font-weight: 600; }
    .tagline { font-size: 14px; color: #00ff88; font-weight: 800; letter-spacing: 2px; margin: 12px 0 25px 0; }
    h1 { font-size: 38px; font-weight: 900; margin-bottom: 10px; line-height: 1.2; }
    .subtitle { color: #aaa; font-size: 14px; margin-bottom: 25px; font-weight: 500; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; color: #aaa; margin-bottom: 8px; font-weight: 600; }
    input { width: 100%; padding: 16px; background: #121a16; border: 1px solid #1e2a24; border-radius: 12px; color: #fff; font-size: 15px; font-weight: 600; outline: none; }
    input:focus { border-color: #00ff88; }
    .rate-display { background: #121a16; border: 1px solid #1e2a24; border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .rate-display .label { font-size: 13px; color: #aaa; font-weight: 600; }
    .rate-display .value { font-size: 18px; font-weight: 900; color: #00ff88; }
    .btn { width: 100%; padding: 18px; background: #00ff88; color: #000; border: none; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
    .btn:active { transform: scale(0.98); }
    .btn .usdt-icon { width: 22px; height: 22px; background: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; color: #00ff88; }
    .brand-name { text-align: center; font-size: 22px; font-weight: 900; color: #00ff88; letter-spacing: 4px; margin-top: 18px; }
    .warning { font-size: 12px; color: #ffaa00; text-align: center; margin-top: 15px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-box"></div>
    <div class="brand-sub">USDT EXCHANGE</div>
    <div class="tagline">BUY & SELL USDT FAST</div>

    <h1>BUY USDT<br>WITH NAIRA</h1>
    <p class="subtitle">Enter amount, get instant rate, pay and receive USDT</p>
    
    <!-- NAME FIELD ADDED BACK -->
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="nameInput" placeholder="Enter your full name">
    </div>

    <div class="form-group">
      <label>Amount in Naira (NGN)</label>
      <input type="number" id="nairaInput" placeholder="Enter amount e.g 155000">
    </div>

    <div class="rate-display">
      <span class="label">Current Rate</span>
      <span class="value" id="rateDisplay">₦1,550 / USDT</span>
    </div>

    <div class="form-group">
      <label>You Will Receive</label>
      <input type="text" id="usdtOutput" placeholder="0.0000 USDT" readonly>
    </div>

    <div class="form-group">
      <label>Your TRC20 Wallet Address</label>
      <input type="text" id="walletInput" placeholder="Enter your TRC20 USDT wallet">
    </div>

    <button class="btn" id="buyBtn">
      <span class="usdt-icon">₮</span>
      BUY USDT NOW
    </button>

    <div class="brand-name">NAIRAFLOW</div>

    <p class="warning">⚠️ Rate updates every 5 minutes. Minimum ₦10,000</p>
  </div>

  <script>
    const rate = 1550;
    document.getElementById('rateDisplay').innerText = `₦${rate.toLocaleString()} / USDT`;

    const nairaInput = document.getElementById('nairaInput');
    const usdtOutput = document.getElementById('usdtOutput');

    nairaInput.addEventListener('input', () => {
      const naira = parseFloat(nairaInput.value) || 0;
      const usdt = naira / rate;
      usdtOutput.value = usdt.toFixed(4) + ' USDT';
    });

    document.getElementById('buyBtn').addEventListener('click', () => {
      const name = document.getElementById('nameInput').value.trim(); // NOW GETS FROM INPUT
      const naira = parseFloat(nairaInput.value);
      const wallet = document.getElementById('walletInput').value.trim();

      if(!name) { alert('Please enter your Full Name'); return; }
      if(!naira || naira < 10000) { alert('Minimum order is ₦10,000'); return; }
      if(!wallet) { alert('Please enter your TRC20 Wallet Address'); return; }

      const usdt = (naira / rate).toFixed(4);
      const orderData = { name, nairaAmount: naira, amount: usdt, rate, totalNaira: naira, wallet };
      localStorage.setItem('orderData', JSON.stringify(orderData));
      window.location.href = 'bank-details.html';
    });
  </script>
</body>
      </html>
