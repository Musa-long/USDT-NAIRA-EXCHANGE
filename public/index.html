<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NairaFlow - Buy USDT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Buy USDT with Naira</h1>
    <p>Rate: ₦1,200 per 1 USDT</p>

    <div class="card">
      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name" required>

      <label>Amount in Naira</label>
      <input type="number" id="nairaInput" placeholder="Enter amount e.g 50000" required>

      <div class="result">
        You will get: <span id="usdtResult">0.0000 USDT</span>
      </div>

      <label>Your TRC20 USDT Wallet</label>
      <input type="text" placeholder="Paste your TRC20 wallet" required>

      <button class="submit-btn">Place Order</button>
    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  
  const rate = 1200;
  const nairaInput = document.getElementById('nairaInput');
  const usdtResult = document.getElementById('usdtResult');
  const submitBtn = document.querySelector('.submit-btn');

  // Calculate USDT live
  nairaInput.addEventListener('input', function(){
    let naira = parseFloat(this.value) || 0;
    let usdt = naira / rate;
    usdtResult.innerText = usdt.toFixed(4) + ' USDT';
  });

  // Send data to bank page
  submitBtn.addEventListener('click', function(e){
    e.preventDefault();
    let name = document.querySelector('input[placeholder="Enter your full name"]').value;
    let naira = nairaInput.value;
    let usdt = (naira / rate).toFixed(4);
    let wallet = document.querySelector('input[placeholder="Paste your TRC20 wallet"]').value;
    
    if(!name || !naira || !wallet){
      alert("Please fill all fields");
      return;
    }
    if(naira < 1000){
      alert("Minimum order is ₦1,000");
      return;
    }

    // Pass everything to bank page via URL
    window.location.href = `bank-details.html?name=${encodeURIComponent(name)}&usdt=${usdt}&naira=${naira}&wallet=${encodeURIComponent(wallet)}`;
  });

});
</script>
</body>
      </html>
