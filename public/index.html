<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT to Naira Exchange</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>USDT to Naira Exchange</h1>
        <form id="orderForm">
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="text" id="whatsapp" placeholder="WhatsApp Number" required>
            <input type="number" id="usdt" placeholder="USDT Amount" required>
            <input type="text" id="wallet" placeholder="Your USDT Wallet Address" required>
            <button type="submit">Submit Order</button>
        </form>
        <div id="result"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
