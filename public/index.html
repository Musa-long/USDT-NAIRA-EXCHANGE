<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NairaFlow - Buy USDT</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #000; color: #fff; display: flex; justify-content: center; padding: 20px; min-height: 100vh; }
    .container { width: 100%; max-width: 450px; margin-top: 40px; }
    .container h1 { font-size: 28px; font-weight: 900; margin-bottom: 5px; }
    .container p { color: #aaa; margin-bottom: 20px; font-weight: 500; }
    .card { background: #111; padding: 25px; border-radius: 16px; border: 1px solid #222; }
    label { display: block; font-weight: 700; margin: 15px 0 8px 0; font-size: 14px; color: #ddd; }
    input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 16px; font-weight: 600; outline: none; margin-bottom: 5px; }
    input:focus { border-color: #00C853; }
    .result { display: flex; justify-content: space-between; margin: 20px 0; font-weight: 800; font-size: 16px; }
    .result span { color: #00C853; font-weight: 900; }
    .submit-btn { width: 100%; padding: 16px; background: #00C853; color: #000; border: none; border-radius: 12px; font-size: 18px; font-weight: 900; cursor: pointer; margin-top: 10px; }
    .submit-btn:hover { background: #00E676; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Buy USDT with Naira</h1>
    <p>Rate: ₦1,200 per 1 USDT</p>

    <div class="card">
      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name" required>

      <label>Amount in Naira</label>
      <input type="number" id="nairaInput" placeholder="Enter amount e.g 50000" required>

      <div class="result">
        <span>You will get:</span> <span id="usdtResult">0.0000 USDT</span>
      </div>

      <label>Your TRC20 USDT Wallet</label>
      <input type="text" placeholder="Paste your TRC20 wallet" required>

      <button class="submit-btn">Place Order</button>
    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const rate = 1200;
  const nairaInput = document.getElementById('nairaInput');
  const usdtResult = document.getElementById('usdtResult');
  const submitBtn = document.querySelector('.submit-btn');

  nairaInput.addEventListener('input', function(){
    let naira = parseFloat(this.value) || 0;
    let usdt = naira / rate;
    usdtResult.innerText = usdt.toFixed(4) + ' USDT';
  });

  submitBtn.addEventListener('click', function(e){
    e.preventDefault();
    let name = document.querySelector('input[placeholder="Enter your full name"]').value;
    let naira = nairaInput.value;
    let usdt = (naira / rate).toFixed(4);
    let wallet = document.querySelector('input[placeholder="Paste your TRC20 wallet"]').value;
    
    if(!name || !naira || !wallet){
      alert("Please fill all fields");
      return;
    }
    window.location.href = `bank-details.html?name=${encodeURIComponent(name)}&usdt=${usdt}&naira=${naira}&wallet=${encodeURIComponent(wallet)}`;
  });
});
</script>
</body>
  </html>
