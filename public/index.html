<script>
  const rate = 1200;
  const nairaInput = document.getElementById('nairaInput');
  const usdtResult = document.getElementById('usdtResult');

  nairaInput.addEventListener('input', function(){
    let naira = parseFloat(this.value) || 0;
    let usdt = naira / rate;
    usdtResult.innerText = usdt.toFixed(4) + ' USDT';
  });

  // When user clicks Place Order
  document.querySelector('.submit-btn').addEventListener('click', function(e){
    e.preventDefault();
    let name = document.querySelector('input[placeholder="Enter your full name"]').value;
    let naira = nairaInput.value;
    let usdt = (naira / rate).toFixed(4);
    let wallet = document.querySelector('input[placeholder="Paste your TRC20 wallet"]').value;
    
    if(!name || !naira || !wallet){
      alert("Please fill all fields");
      return;
    }

    // Pass everything to bank page
    window.location.href = `/bank-details.html?name=${encodeURIComponent(name)}&usdt=${usdt}&naira=${naira}&wallet=${encodeURIComponent(wallet)}`;
  });
</script>
