    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }

    .brand-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .logo { width: 48px; height: 48px; background: #00ff88; border-radius: 14px; display: flex; align-items: center; justify-content: center; }

    .live-dot { width: 6px; height: 6px; background: #00ff88; border-radius: 50%; animation: pulse 1.5s infinite; }

    .rate { font-size: 24px; color: #00ff88; font-weight: bold; margin-bottom: 20px; }
    .error { color: #ff4444; font-size: 12px; margin-bottom: 15px; }
    .form-group { margin-bottom: 15px; }
    .label { font-size: 13px; color: #ccc; margin-bottom: 8px; }

    .input-box input { background: transparent; border: none; outline: none; color: #fff; width: 100%; font-size: 15px; }
    .input-box input::placeholder { color: #666; }
    .usdt-preview { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 14px; }
