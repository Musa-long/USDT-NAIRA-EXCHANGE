<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NairaFlow - Order Received</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #0a0f0d; color: #fff; min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; text-align: center; }
    .container { width: 100%; max-width: 450px; }
    .logo-box { width: 48px; height: 48px; background: #00ff88; border-radius: 14px; margin: 0 auto 8px auto; }
    .brand-sub { font-size: 13px; color: #888; letter-spacing: 1px; font-weight: 600; }
    .tagline { font-size: 14px; color: #00ff88; font-weight: 800; letter-spacing: 2px; margin: 12px 0 25px 0; }
    .check { font-size: 60px; color: #00ff88; margin-bottom: 15px; }
    h1 { font-size: 28px; font-weight: 900; margin-bottom: 10px; }
    .subtitle { color: #aaa; font-size: 14px; margin-bottom: 25px; font-weight: 500; }
    .card { background: #121a16; border: 1px solid #1e2a24; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .card p { font-size: 15px; line-height: 1.6; color: #ccc; font-weight: 600; }
    .card b { color: #00ff88; font-size: 18px; }
    .btn { width: 100%; padding: 16px; background: #25D366; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; text-decoration: none; display: block; margin-bottom: 10px; }
    .btn:active { transform: scale(0.98); }
    .btn-secondary { background: #1a231f; color: #00ff88; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-box"></div>
    <div class="brand-sub">USDT EXCHANGE</div>
    <div class="tagline">ORDER CONFIRMED</div>

    <div class="check">✓</div>
    <h1>ORDER RECEIVED!</h1>
    <p class="subtitle" id="greeting">We have received your order</p>
    
    <div class="card">
      <p>You ordered: <b id="usdtAmount">0.0000 USDT</b></p>
      <p style="margin-top: 10px; font-size: 13px;">Click the button below to chat with us on WhatsApp. Send proof of payment to +234 916 745 2777 to get your USDT in 5-10 minutes.</p>
    </div>

    <a class="btn" id="whatsappBtn" target="_blank">CHAT ON WHATSAPP: +234 916 745 2777</a>
    <a href="/" class="btn btn-secondary">PLACE NEW ORDER</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const usdt = urlParams.get('usdt');
    const name = urlParams.get('name');
    const whatsappNumber = "2349167452777"; // CORRECTED: +234 916 745 2777

    if(name) {
        document.getElementById('greeting').innerText = `Hi ${name}, we received your order for ${usdt} USDT`;
    }
    if(usdt) {
        document.getElementById('usdtAmount').innerText = usdt + ' USDT';
    }

    const message = `Hello NairaFlow, I just placed an order for ${usdt} USDT. Name: ${name}. I have made payment to DATA/247 COMMUNICATION LTD-wad.`;
    document.getElementById('whatsappBtn').href = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
  </script>
</body>
</html>
