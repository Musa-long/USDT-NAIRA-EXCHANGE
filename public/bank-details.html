<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Details - NairaFlow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
    body { background: #000; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 400px; background: #111; padding: 25px; border-radius: 12px; text-align: center; }
    h1 { color: #00ff88; margin-bottom: 20px; }
    .box { background: #1a1a1a; padding: 15px; border-radius: 8px; margin: 15px 0; text-align: left; border: 1px solid #222; }
    .total { font-size: 28px; color: #00ff88; font-weight: bold; text-align: center; }
    .label { color: #888; font-size: 12px; }
    .value { font-size: 16px; margin-top: 5px; font-weight: bold; word-break: break-all; }
    .btn { width: 100%; padding: 15px; background: #00ff88; color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn2 { background: #333; color: #00ff88; }
    .btn:active { transform: scale(0.98); }
    .note { font-size: 12px; color: #aaa; margin-top: 15px; }

    /* SCREENSHOT BUTTON */
    .screenshot-btn { width: 100%; padding: 15px; background: #FFA500; color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 25px; }
    .screenshot-note { font-size: 11px; color: #aaa; margin-top: 8px; margin-bottom: 15px; }

    /* RECEIVE USDT + COUNTDOWN */
    .receive-btn { width: 100%; padding: 15px; background: #00ff88; color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 10px; }
    .countdown-box { background: #1a231f; border: 1px solid #00ff88; border-radius: 8px; padding: 15px; margin-top: 15px; display: none; }
    .countdown-timer { font-size: 24px; color: #00ff88; font-weight: bold; }
    .processing-text { font-size: 13px; color: #aaa; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Complete Your Order</h1>

    <div class="box">
      <div class="label">Name</div>
      <div class="value" id="name">Loading...</div>
    </div>

    <div class="box">
      <div class="label">USDT Amount</div>
      <div class="value" id="usdtAmount">Loading...</div>
    </div>

    <div class="box">
      <div class="label">Rate</div>
      <div class="value">₦<span id="rate">--</span> / 1 USDT</div>
    </div>

    <div class="box">
      <div class="label">Total Amount To Pay</div>
      <div class="total">₦<span id="total">0</span></div>
    </div>

    <div class="box">
      <div class="label">Your Wallet Address</div>
      <div class="value" id="wallet">Loading...</div>
    </div>

    <h3 style="margin-top: 20px; color: #00ff88;">Transfer To:</h3>
    <div class="box">
      <div class="label">Bank Name</div>
      <div class="value">Sterling Bank</div>
      <div class="label" style="margin-top:10px;">Account Name</div>
      <div class="value">DATA/247 COMMUNICATION LTD-WAD</div>
      <div class="label" style="margin-top:10px;">Account Number</div>
      <div class="value">8387778364 <button onclick="copyAcc()" style="background:#333; color:#00ff88; border:none; padding:4px 8px; border-radius:4px; font-size:11px; margin-left:5px; cursor:pointer;">Copy</button></div>
    </div>

    <!-- BUTTONS -->
    <label for="screenshot" class="screenshot-btn">📸 Submit Payment Screenshot</label>
    <input type="file" id="screenshot" accept="image/*" capture="camera" style="display:none;" onchange="sendToWhatsApp(this)">
    <p class="screenshot-note">Upload proof after payment</p>

    <button class="receive-btn" id="receiveBtn" onclick="startProcessing()">RECEIVE
